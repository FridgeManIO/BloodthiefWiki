site_name: Bloodthief Wiki
site_url: https://bloodthiefwikidocs.pages.dev/
theme:
    name: material
    palette:
        #Dark Mode
        scheme: slate
        primary: red
        accent: orange
    features:
        - navigation.footer
        - navigation.instant
        - navigation.prefetch
    logo: assets/logo.png
    favicon: assets/icon.ico
    extra_css: [extra-style.css]

extra:
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/FridgeManIO/BloodthiefWiki
        - icon: fontawesome/brands/steam
          link: https://store.steampowered.com/app/2533600/Bloodthief/
        - icon: fontawesome/brands/youtube
          link: https://www.youtube.com/@Blargis3d
        - icon: fontawesome/brands/twitch
          link: https://www.twitch.tv/blargisdev
        - icon: fontawesome/brands/discord
          link: https://discord.gg/aU5naj2fgY
# copyright: Copyright &copy; Date Name (change footer info in mkdocs.yml)

plugins:
    - search
    - social

nav:
    - Home: index.md
    - Modding: modding.md
    - Speedrunning: speedrunning.md
    - Mapping:
          - Mapping Home: blarg_docs/docs/index.md
          - Mapping Guide: blarg_docs/docs/mapping-guide.md
          - Entity Reference: blarg_docs/docs/entity-reference.md
    - Artifacts [WIP]:
          - artifacts/sires_blade.md
    - Campaign Levels [WIP]:
          - (1-1) Varu Underbelly: campaign_levels/1-1.md
          - (1-2) Varu Rooftops: campaign_levels/1-2.md
          - (1-3) Varu Castle: campaign_levels/1-3.md
          - (S-1) Old Varu Palace: campaign_levels/S-1.md
          - (1-4) Varu Sewers: campaign_levels/1-4.md
          - (1-5) Blighted Holdfast: campaign_levels/1-5.md
          - (1-6) Forgotten Wing: campaign_levels/1-6.md
          - (1-7) Buried Keep: campaign_levels/1-7.md
          - (1-8) Depths of the Keep: campaign_levels/1-8.md
          - (1-9) Arxix Gate: campaign_levels/1-9.md
          - (1-10) Doom Chapel: campaign_levels/1-10.md
          - (2-1) Grand Castle Trixia: campaign_levels/2-1.md
          - (2-2) Ignis Morantes: campaign_levels/2-2.md
          - (2-3) Animae Morantes: campaign_levels/2-3.md
          - (2-4) Time Tomb: campaign_levels/2-4.md
          - (2-5) Oex Labor Bell: campaign_levels/2-5.md
          - (2-6) Oex Factory: campaign_levels/2-6.md
          - (2-7) Warded Tunnels: campaign_levels/2-7.md
          - (2-8) Drowned Temple: campaign_levels/2-8.md
          - (2-9) Cloud Castle: campaign_levels/2-9.md
          - (2-10) The Celestial Well: campaign_levels/2-10.md
          - (3-1) Holy City of Nox: campaign_levels/3-1.md
          - (3-2) Nox Passageway: campaign_levels/3-2.md
          - (3-3) Winding Halls of Nox: campaign_levels/3-3.md
          - (3-4) Sea of Souls: campaign_levels/3-4.md
          - (3-5) Dungeon of the Undying: campaign_levels/3-5.md
          - (3-6) Vessels of Pain: campaign_levels/3-6.md
          - (S-2) Hadean Permafrost: campaign_levels/S-2.md
          - (3-7) Vessels of Sorrow: campaign_levels/3-7.md
          - (3-8) Elder Forge: campaign_levels/3-8.md
          - (3-9) Buried Library of Exrion: campaign_levels/3-9.md
